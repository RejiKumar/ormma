<title>Ormma Family Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a 393x852 phone centered on a muted stage; below 440px wide the phone fills the screen. Single committed look (warm cream + deep sage), set explicitly so it reads the same in either host theme. */
:root{
  --cream:#F8F7F4; --sage:#2D5A4C; --sage-soft:#EBF1EE; --card:#FFFFFF; --line:#E5E2DC;
  --terra:#C85A32; --terra-soft:#FCEEE8; --ink:#1A2421; --muted:#6B7470; --stage:#E4E1DA;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 2px 8px rgba(26,36,33,.04);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .15s ease,background .2s,opacity .2s}
button:active,.press:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;letter-spacing:-.2px}

.phone{position:relative;width:393px;height:852px;flex:none;background:var(--cream);border-radius:48px;border:10px solid #15201C;box-shadow:0 30px 60px rgba(26,36,33,.25);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:440px){
  body{background:var(--cream)}
  .phone{width:100vw;height:100%;border:0;border-radius:0;box-shadow:none}
  .island{display:none}
}

/* status bar + app bar */
.status{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0;font-weight:600;font-size:14px;position:relative}
.island{position:absolute;left:50%;top:8px;width:104px;height:28px;margin-left:-52px;background:#0c1210;border-radius:20px}
.sys{display:flex;gap:6px;align-items:center}
.appbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.6px;color:var(--sage)}
.loc{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:9999px;padding:6px 12px 6px 10px;font-size:12px;font-weight:500;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:#3F9B6E;box-shadow:0 0 0 3px rgba(63,155,110,.18);transition:background .3s}
.alert .dot{background:var(--terra);box-shadow:0 0 0 3px rgba(200,90,50,.2)}

/* demo switcher */
.switch{flex:none;margin:0 20px 10px;display:flex;background:var(--sage-soft);border-radius:9999px;padding:3px;position:relative}
.switch button{flex:1;position:relative;z-index:1;padding:7px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:9999px}
.switch button[aria-pressed=true]{color:var(--sage)}
.switch .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:9999px;box-shadow:0 1px 4px rgba(26,36,33,.12);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.alert .switch .thumb{transform:translateX(100%)}

/* scroll area */
.view{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.page{display:flex;flex-direction:column;gap:14px;animation:in .35s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.meta{font-size:11px;font-weight:500;color:var(--muted)}
.label{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 0}
.sec-h h2{font-size:16px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--sage);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;transition:background .4s}
.hero::before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%);pointer-events:none}
.alert .hero{background:linear-gradient(160deg,#2D5A4C 0%,#7A4A38 140%)}
.hero-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:rgba(255,255,255,.8)}
.hero-main{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:18px;line-height:1}
.ring .c small{font-size:9px;font-weight:500;opacity:.75;margin-top:3px;letter-spacing:.4px}
.ring circle.fg{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.hero h1{font-size:20px;line-height:1.25}
.hero p{font-size:13px;color:rgba(255,255,255,.78);margin-top:3px}
.hero-btn{align-self:flex-start;background:#fff;color:var(--terra);font-weight:600;font-size:13px;padding:9px 16px;border-radius:9999px}

/* presence */
.presence{display:flex;align-items:center;gap:12px;padding:12px 14px}
.avs{display:flex;flex:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--card);margin-left:-8px}
.av:first-child{margin-left:0}
.av.a{background:var(--sage);color:#fff}.av.b{background:#D9A441;color:#fff}.av.c{background:#8FA79C;color:#fff}
.av.lg{width:42px;height:42px;font-size:15px;margin:0;border:0}
.presence .t{flex:1;min-width:0;font-size:12px;line-height:1.4}
.presence .t b{font-weight:600}
.pill{border-radius:9999px;font-size:12px;font-weight:600;padding:8px 12px;white-space:nowrap}
.pill.terra{background:var(--terra-soft);color:var(--terra)}
.pill.sage{background:var(--sage-soft);color:var(--sage)}
.pill.done{background:var(--sage);color:#fff}

/* timeline */
.tl{display:flex;flex-direction:column}
.dose{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;flex:none;width:30px}
.node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;transition:all .3s}
.node.taken{background:var(--sage);color:#fff}
.node.sched{border:1.5px dashed #A9B4AF;color:var(--muted);background:var(--card)}
.node.miss{background:var(--terra);color:#fff}
.line{flex:1;width:2px;background:var(--line);margin:4px 0}
.dose:last-child .line{display:none}
.dose .body{flex:1;min-width:0;padding-bottom:14px}
.dose .card{display:flex;flex-direction:column;gap:10px}
.dose-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dose-h h3{font-size:15px}
.badge{font-size:10px;font-weight:600;padding:4px 9px;border-radius:9999px;white-space:nowrap}
.badge.taken{background:var(--sage-soft);color:var(--sage)}
.badge.miss{background:var(--terra-soft);color:var(--terra)}
.badge.sched{background:#F1EFEA;color:var(--muted)}
.meds{font-size:13px;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:9999px;padding:4px 10px}
.pilldot{width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #9AA5A0;flex:none}
.note{background:var(--sage-soft);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.45}
.note q{font-style:normal;font-weight:600;color:var(--sage);quotes:"\2018" "\2019"}
.alert .note.warn,.note.warn{background:var(--terra-soft)}
.receipts{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}

/* whatsapp */
.wa-prev{background:#F1F5F2;border-radius:16px;border-top-left-radius:4px;padding:12px;font-size:12.5px;line-height:1.5;white-space:pre-line;margin-top:10px}
.btn{width:100%;margin-top:12px;background:var(--sage);color:#fff;font-weight:600;font-size:14px;padding:12px;border-radius:9999px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--sage-soft);color:var(--sage)}
.btn.terra{background:var(--terra);color:#fff}

/* medicines */
.med{display:flex;gap:12px;align-items:flex-start}
.med-ic{width:44px;height:44px;border-radius:14px;background:var(--sage-soft);display:grid;place-items:center;flex:none}
.med .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.med h3{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* escalation */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:12px}
.step .body{flex:1;min-width:0;padding-bottom:16px}
.step:last-child .line{display:none}
.step h3{font-size:14px}
.step.standby{opacity:.55}
.contacts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.contact{display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.contact .n{flex:1;min-width:0}
.contact .n b{display:block;font-size:13px;font-weight:600}
.callbtn{display:flex;align-items:center;gap:6px;background:var(--terra);color:#fff;font-weight:600;font-size:12px;padding:8px 14px;border-radius:9999px}
.calm{text-align:center;padding:22px 16px}
.calm .big{width:52px;height:52px;border-radius:50%;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;margin:0 auto 10px}

/* family */
.row{display:flex;align-items:center;gap:12px}
.row+.row{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-weight:600;font-size:14px}
.toggle{width:44px;height:26px;border-radius:9999px;background:#D5D9D6;position:relative;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s}
.toggle[aria-checked=true]{background:var(--sage)}
.toggle[aria-checked=true]::after{transform:translateX(18px)}
.calllog .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.calllog .ic.ok{background:var(--sage-soft);color:var(--sage)}
.calllog .ic.no{background:var(--terra-soft);color:var(--terra)}
.calllog .ic.fam{background:#FBF1DA;color:#9A6B12}

/* tab bar */
.tabs{flex:none;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px 22px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);position:relative;padding:4px 0}
.tab[aria-selected=true]{color:var(--sage);font-weight:600}
.tab .ib{position:relative;width:48px;height:28px;border-radius:9999px;display:grid;place-items:center;transition:background .25s}
.tab[aria-selected=true] .ib{background:var(--sage-soft)}
.pulse{position:absolute;top:1px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--terra);border:2px solid #fff}
.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--terra);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}

/* toast */
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:12px 16px;border-radius:9999px;text-align:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .25s;z-index:5}
.toast.show{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="phone" id="phone">
  <div class="status" aria-hidden="true">
    <span>9:41</span><div class="island"></div>
    <div class="sys">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".5"/></svg>
    </div>
  </div>
  <header class="appbar">
    <span class="brand">ormma</span>

</div>

<script>
(function(){
  var I = {
    heart:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.600 3 5 6.500 5c2 0 3.700 1.100 5.500 3.200C13.800 6.100 15.500 5 17.500 5 21 5 22.800 8.600 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg>',
    check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>',
    clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    phone:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    eye:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    bell:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>',
    pill:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D5A4C" stroke-width="2" stroke-linecap="round"><rect x="2.500" y="8.500" width="19" height="7" rx="3.500" transform="rotate(-40 12 12)"/><path d="M9.500 14.500l5-5" transform="rotate(0)"/></svg>',
    users:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.5-3.500 3-5.500 6.500-5.500s6 2 6.500 5.500"/><circle cx="17.500" cy="9" r="2.500"/><path d="M17 14.500c2.500.2 4 1.800 4.500 4.500"/></svg>',
    sun:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.400 1.400M17.600 17.600L19 19M5 19l1.400-1.400M17.600 6.400L19 5"/></svg>',
    alert:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>'
  };

  var state = {
    mode:'normal', tab:'today', calledAmma:false,
    taken:{ morning:'8:34 AM', afternoon:'1:36 PM', night:null },
    notify:{ missed:true, daily:true, quiet:false }
  };

  var DOSES = [
    {id:'morning', time:'8:30 AM', name:'Morning', meds:'Metformin 500mg + Amlodipine 5mg', tag:'Small round white tablet in silver strip',
     note:'Amma confirmed taking sugar medicine (<q>kazhichu mole</q>) after morning tea, and said her knee felt better today.', reads:'Seen by Rahul 8:42 AM · Meera 9:10 AM'},
    {id:'afternoon', time:'1:30 PM', name:'Afternoon', meds:'Metformin 500mg', tag:'Small round white tablet in silver strip',
     note:'Amma said she took it right after lunch and was going to rest.', reads:'Seen by Rahul 1:48 PM'},
    {id:'night', time:'9:00 PM', name:'Night', meds:'Atorvastatin 10mg', tag:'Oval pink tablet, blister pack', note:'', reads:''}
  ];

  var MEDS = [
    {n:'Metformin', d:'500mg', f:'Twice daily · morning and afternoon, after food', v:'Small round white tablet in silver strip', for:'Sugar'},
    {n:'Amlodipine', d:'5mg', f:'Once daily · morning', v:'Small yellow tablet in green strip', for:'Blood pressure'},
    {n:'Atorvastatin', d:'10mg', f:'Once daily · night, after dinner', v:'Oval pink tablet, blister pack', for:'Cholesterol'}
  ];

  function applyMode(m){
    state.mode = m;
    state.taken = m==='normal' ? {morning:'8:34 AM', afternoon:'1:36 PM', night:null} : {morning:null, afternoon:null, night:null};
    state.calledAmma = false;
  }
  function count(){ var c=0; for(var k in state.taken) if(state.taken[k]) c++; return c; }
  function status(d){
    if(state.taken[d.id]) return 'taken';
    if(d.id==='morning' && state.mode==='missed') return 'miss';
    return 'sched';
  }
  function $(s){return document.querySelector(s)}
  var alertMode = function(){ return state.mode==='missed' && !state.taken.morning };

  /* ---------- views ---------- */
  function hero(){
    var n=count(), C=2*Math.PI*32, off=C*(1-n/3), al=alertMode();
    return '<section class="hero">'+
      '<div class="hero-top">'+I.heart+'<span>Mon, 19 October</span></div>'+
      '<div class="hero-main"><div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="7"/>'+
      '<circle class="fg" cx="38" cy="38" r="32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
      '<div class="c">'+n+'/3<small>TAKEN</small></div></div>'+
      '<div><h1>'+(al?'Amma hasn’t confirmed her morning dose':n===3?'Amma took everything today':'Amma is on track today')+'</h1>'+
      '<p>'+(al?'Ormma called 3 times and has alerted the family.':n===3?'All three doses confirmed.':'Next: Atorvastatin at 9:00 PM')+'</p></div></div>'+
      (al?'<button class="hero-btn" data-go="escalation">See what Ormma tried</button>':'')+
    '</section>';
  }
  function presence(){
    var txt = state.calledAmma ? '<b>You</b> called Amma · just now' :
      alertMode() ? '<b>Rahul</b> and <b>Meera</b> have been alerted · last call 6:10 PM yesterday' :
      '<b>Rahul</b> is viewing · last call 6:10 PM yesterday';
    return '<section class="card presence"><div class="avs"><span class="av a">R</span><span class="av b">M</span><span class="av c">Y</span></div>'+
      '<div class="t">'+txt+'</div>'+
      (state.calledAmma ? '<span class="pill sage">Logged</span>' : '<button class="pill terra" data-act="called">I called Amma</button>')+'</section>';
  }
  function doseCard(d){
    var s=status(d), t=state.taken[d.id];
    var badge = s==='taken' ? (d.id==='morning'?'Taken on time · ':'Taken · ')+t : s==='miss' ? 'Not confirmed' : 'Scheduled';
    var ic = s==='taken'?I.check : s==='miss'?I.x : I.clock;
    var h = '<div class="dose"><div class="rail"><span class="node '+s+'">'+ic+'</span><span class="line"></span></div><div class="body"><div class="card press">'+
      '<div class="dose-h"><div><div class="meta">'+d.time+'</div><h3>'+d.name+'</h3></div><span class="badge '+s+'">'+badge+'</span></div>'+
      '<div class="meds">'+d.meds+'</div><div><span class="tag"><span class="pilldot"></span>'+d.tag+'</span></div>';
    if(s==='taken' && d.note) h += '<div class="note">'+d.note+'</div><div class="receipts">'+I.eye+'<span>'+d.reads+'</span></div>';
    if(s==='miss') h += '<div class="note warn">No reply after 3 calls. Ormma will keep trying gently and has told the family.</div>';
    if(s!=='taken') h += '<button class="pill '+(s==='miss'?'terra':'sage')+'" style="align-self:flex-start" data-act="confirm" data-id="'+d.id+'">'+(s==='miss'?'Amma confirmed on a call':'Mark as taken (demo)')+'</button>';
    return h+'</div></div></div>';
  }
  function digest(){
    var n=count(), al=alertMode();
    var msg = al
      ? 'Ormma update, Mon 19 Oct\nAmma has not confirmed her 8:30 AM dose (Metformin + Amlodipine). Ormma called 3 times. Please check on her.'
      : 'Ormma update, Mon 19 Oct\nAmma is on track: '+n+' of 3 doses confirmed. Morning dose taken at 8:34 AM after tea. Next: Atorvastatin at 9:00 PM.';
    return {msg:msg, html:'<section class="card"><div class="row"><div class="n"><div class="label">WhatsApp digest</div><h3 style="font-size:15px;margin-top:2px">Share with the family</h3></div></div><div class="wa-prev">'+msg.replace(/&/g,'&amp;')+'</div>'+
      '<button class="btn" data-act="copy">'+I.copy+'Copy update for WhatsApp</button></section>'};
  }
  function today(){
    var h = hero()+presence()+'<div class="sec-h"><h2>Today’s doses</h2><span class="meta">3 scheduled</span></div><div class="tl">'+DOSES.map(doseCard).join('')+'</div>'+digest().html;
    return h;
  }
  function medicines(){
    return '<div class="sec-h"><h2>Amma’s medicines</h2><span class="meta">3 active</span></div>'+
      MEDS.map(function(m){return '<div class="card press med"><div class="med-ic">'+I.pill+'</div><div class="info"><div class="dose-h"><h3>'+m.n+' <span style="font-weight:500;color:var(--muted)">'+m.d+'</span></h3><span class="badge taken">Active</span></div>'+
        '<div class="meds" style="font-weight:400">'+m.f+'</div><div class="chips"><span class="tag"><span class="pilldot"></span>'+m.v+'</span><span class="tag">For '+m.for+'</span></div></div></div>';}).join('')+
      '<div class="card" style="background:var(--sage-soft);border-color:transparent"><div class="meta" style="color:var(--sage)">Prescribed by Dr. Nair · refill due 2 Nov</div></div>';
  }
  function escalation(){
    var al=alertMode(), cls=al?'':' standby';
    function st(ic,c,t,title,desc){return '<div class="step'+cls+'"><div class="rail"><span class="node '+c+'">'+ic+'</span><span class="line"></span></div><div class="body"><div class="meta">'+t+'</div><h3>'+title+'</h3><p class="meta" style="font-size:12px;margin-top:2px">'+desc+'</p></div></div>';}
    var c = al?'miss':'sched', icx = al?I.x:I.clock;
    var steps =
      st(icx,c,'8:30 AM','Call 1 · Unanswered','Ormma rang Amma and spoke in Malayalam. No pickup.')+
      st(icx,c,'8:40 AM','Retry 1 · Unanswered','A second gentle call ten minutes later.')+
      st(icx,c,'8:50 AM','Retry 2 · Unanswered','Last attempt before the family is told.')+
      '<div class="step'+cls+'"><div class="rail"><span class="node '+(al?'miss':'sched')+'">'+I.bell+'</span><span class="line"></span></div><div class="body"><div class="meta">9:30 AM</div><h3>Caregiver alert</h3><p class="meta" style="font-size:12px;margin-top:2px">'+(al?'Rahul and Meera were notified. Reach someone near Amma now:':'If three calls go unanswered, the family is alerted and these contacts are offered.')+'</p>'+
      '<div class="contacts"><div class="contact"><span class="av lg b">S</span><div class="n"><b>Neighbour Sreeja</b><span class="meta">2 min walk from Amma</span></div><button class="callbtn" data-act="call" data-who="Sreeja"'+(al?'':' disabled style="opacity:.5"')+'>'+I.phone+'Call</button></div>'+
      '<div class="contact"><span class="av lg a">N</span><div class="n"><b>Clinic Dr. Nair</b><span class="meta">Open until 1 PM</span></div><button class="callbtn" data-act="call" data-who="the clinic"'+(al?'':' disabled style="opacity:.5"')+'>'+I.phone+'Call</button></div></div></div></div>';
    var top = al ?
      '<div class="card" style="background:var(--terra-soft);border-color:transparent"><div class="label" style="color:var(--terra)">Morning dose · missed</div><h2 style="font-size:17px;margin-top:2px">Ormma tried 3 times</h2><p class="meta" style="font-size:12.5px;margin-top:2px">Nothing urgent is known. Amma may be at the temple or have left her phone in another room.</p></div>' :
      '<div class="card calm"><div class="big">'+I.check+'</div><h2 style="font-size:17px">Nothing to escalate today</h2><p class="meta" style="font-size:12.5px;margin-top:4px">Amma replied to every call. This is the steps Ormma follows if she doesn’t.</p></div>';
    return top+'<div class="sec-h"><h2>Check-in protocol</h2></div><div class="card steps">'+steps+'</div>';
  }
  function toggleRow(k,t,d){return '<div class="row"><div class="n"><b>'+t+'</b><span class="meta">'+d+'</span></div><button class="toggle" role="switch" aria-checked="'+state.notify[k]+'" aria-label="'+t+'" data-act="notify" data-k="'+k+'"></button></div>';}
  function family(){
    var log = [];
    if(state.calledAmma) log.push({c:'fam',i:I.phone,t:'You called Amma',d:'Just now · logged by you'});
    if(alertMode()) log.push({c:'no',i:I.x,t:'Ormma, 8:50 AM',d:'Unanswered · retry 2'},{c:'no',i:I.x,t:'Ormma, 8:40 AM',d:'Unanswered · retry 1'},{c:'no',i:I.x,t:'Ormma, 8:30 AM',d:'Unanswered · call 1'});
    else log.push({c:'ok',i:I.check,t:'Ormma, 1:30 PM',d:'Answered · 1 min 12 s'},{c:'ok',i:I.check,t:'Ormma, 8:30 AM',d:'Answered · 48 s'});
    log.push({c:'fam',i:I.phone,t:'Rahul called Amma',d:'Yesterday, 6:10 PM · 6 min'});
    return '<div class="sec-h"><h2>Caregiver circle</h2><span class="meta">3 members</span></div>'+
      '<section class="card">'+
      '<div class="row"><span class="av lg a">R</span><div class="n"><b>Rahul</b><span class="meta">Son · Bengaluru · Primary</span></div><span class="badge taken">Viewing</span></div>'+
      '<div class="row"><span class="av lg b">M</span><div class="n"><b>Meera</b><span class="meta">Daughter · Dubai</span></div><span class="badge sched">Seen 9:10 AM</span></div>'+
      '<div class="row"><span class="av lg c">Y</span><div class="n"><b>Yadav</b><span class="meta">Grandson · Chennai</span></div><span class="badge sched">Seen yesterday</span></div></section>'+
      '<div class="sec-h"><h2>Notifications</h2></div><section class="card">'+
      toggleRow('missed','Missed-dose alerts','Push and WhatsApp, as soon as it happens')+
      toggleRow('daily','Evening summary','One digest at 8 PM')+
      toggleRow('quiet','Quiet hours','Pause non-urgent alerts 10 PM to 6 AM')+'</section>'+
      '<div class="sec-h"><h2>Call history</h2></div><section class="card calllog">'+
      log.map(function(l){return '<div class="row"><span class="ic '+l.c+'">'+l.i+'</span><div class="n"><b style="font-size:13px">'+l.t+'</b><span class="meta">'+l.d+'</span></div></div>';}).join('')+'</section>';
  }

  var TABS = [
    {id:'today',label:'Today',icon:I.heart.replace('width="14" height="14"','width="22" height="22"')},
    {id:'medicines',label:'Medicines',icon:I.pill.replace(/#2D5A4C/,'currentColor')},
    {id:'escalation',label:'Escalation',icon:I.alert},
    {id:'family',label:'Family',icon:I.users}
  ];
  var VIEWS = {today:today, medicines:medicines, escalation:escalation, family:family};

  /* ---------- render ---------- */
  var view=$('#view'), phone=$('#phone');
  function render(animate){
    phone.classList.toggle('alert', alertMode());
    document.querySelectorAll('.switch button').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.mode===state.mode));});
    $('#tabs').innerHTML = TABS.map(function(t){
      return '<button class="tab" role="tab" data-go="'+t.id+'" aria-selected="'+(state.tab===t.id)+'"><span class="ib">'+t.icon+(t.id==='escalation'&&alertMode()?'<span class="pulse"></span>':'')+'</span>'+t.label+'</button>';
    }).join('');
    var scroll = view.scrollTop;
    view.innerHTML = '<div class="page" '+(animate?'':'style="animation:none"')+'>'+VIEWS[state.tab]()+'</div>';
    view.scrollTop = animate ? 0 : scroll;
  }

  /* ring animates from previous value */
  function renderKeepRing(){
    var prev = document.querySelector('.ring circle.fg');
    var po = prev ? prev.getAttribute('stroke-dashoffset') : null;
    render(false);
    var cur = document.querySelector('.ring circle.fg');
    if(prev && cur){
      var to = cur.getAttribute('stroke-dashoffset');
      cur.setAttribute('stroke-dashoffset', po);
      requestAnimationFrame(function(){requestAnimationFrame(function(){cur.setAttribute('stroke-dashoffset', to);});});
    }
  }

  var tt;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2200);}

  function copy(text){
    function fallback(){
      var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'Copied. Paste it in WhatsApp.':'Select the text above and copy it');
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Copied. Paste it in WhatsApp.');},fallback);}else fallback();
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-mode],[data-go],[data-act]'); if(!el) return;
    if(el.dataset.mode){ if(el.dataset.mode!==state.mode){applyMode(el.dataset.mode);render(true);toast(state.mode==='missed'?'Simulating: Amma missed her 8:30 AM dose':'Back to a normal day');} return; }
    if(el.dataset.go){ if(el.dataset.go!==state.tab){state.tab=el.dataset.go;render(true);} return; }
    var a=el.dataset.act;
    if(a==='called'){ state.calledAmma=true; renderKeepRing(); toast('Logged: you called Amma'); }
    else if(a==='confirm'){
      var d=el.dataset.id; var now = d==='morning'?'9:44 AM':d==='night'?'9:02 PM':'1:36 PM';
      state.taken[d]=now; renderKeepRing(); toast(d==='morning'?'Great. Family notified Amma is okay.':'Dose marked as taken');
    }
    else if(a==='copy'){ copy(digest().msg); }
    else if(a==='call'){ toast('Calling '+el.dataset.who+'… (demo)'); }
    else if(a==='notify'){ var k=el.dataset.k; state.notify[k]=!state.notify[k]; renderKeepRing(); }
  });

  /* fit the phone to short desktop windows */
  function fit(){
    if(window.innerWidth<=440){phone.style.zoom='';return;}
    var s=Math.min(1,(window.innerHeight-24)/852); phone.style.zoom=s;
  }
  window.addEventListener('resize',fit); fit();

  render(true);
})();
</script>
