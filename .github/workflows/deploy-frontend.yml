name: Deploy frontend (Android release)

# Run by hand: GitHub -> Actions -> "Deploy frontend (Android release)" -> Run workflow.
# Every run raises the version first (versionCode +1 and the patch number +1), builds the signed
# Android App Bundle (.aab) for Google Play, saves it as a downloadable artifact, commits the new
# version back to main, and can upload the bundle to a Play track.
on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Also upload the bundle to Google Play
        type: boolean
        default: false
      track:
        description: Play track (used only when uploading)
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: write # to commit the version bump back to main

jobs:
  release:
    name: Build the signed bundle
    # Production is main; refuse to release from any other branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm --prefix mobile ci

      - name: Typecheck and tests
        run: |
          npm --prefix mobile run typecheck
          npm --prefix mobile test -- --ci

      # Raises android.versionCode and the patch number in mobile/app.json for this release.
      - name: Bump the version
        id: bump
        run: node scripts/bump-version.mjs

      # Secrets: see docs/CI.md. The production Firebase file and the upload key come from GitHub
      # secrets and are written only on the runner.
      - name: Write the production Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/google-services.json

      - name: Write the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ormma-upload.jks"

      # The Android project is generated from app.json and the config plugins, never committed.
      - name: Generate the Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_FIREBASE_EMULATOR_HOST: ""
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release bundle
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_FIREBASE_EMULATOR_HOST: ""
          ORMMA_UPLOAD_STORE_FILE: ${{ runner.temp }}/ormma-upload.jks
          ORMMA_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ORMMA_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORMMA_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Name the bundle after its version
        run: |
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab \
             "ormma-${{ steps.bump.outputs.version }}-${{ steps.bump.outputs.version_code }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ormma-${{ steps.bump.outputs.version }}-${{ steps.bump.outputs.version_code }}
          path: ormma-${{ steps.bump.outputs.version }}-${{ steps.bump.outputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 90

      # Only after a successful build: keep the repository in step with what was shipped.
      - name: Commit the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json
          git commit -m "chore: release ${{ steps.bump.outputs.version }} (versionCode ${{ steps.bump.outputs.version_code }})"
          git push origin HEAD:main

      # The first upload of a new app must be done by hand in the Play Console; after that this works.
      - name: Upload to Google Play
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ormma.app
          releaseFiles: ormma-${{ steps.bump.outputs.version }}-${{ steps.bump.outputs.version_code }}.aab
          track: ${{ inputs.track }}
          status: draft
